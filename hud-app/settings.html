<!doctype html>
<!--
  PitWall HUD — settings and layout.

  The one window a driver ever interacts with. Every widget is a card: a
  switch to turn it on, the settings it actually has, and which screen it
  lives on. The lock control sits at the top because it is the thing you reach
  for most: unlock, drag the widgets where you want them, lock again.

  The cards render from the registry the main process sends, so a widget that
  gains a setting gains a control here with no change to this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PitWall HUD</title>
<style>
  :root {
    --bg: #15171b;
    --panel: #1c1f24;
    --panel-2: #23262c;
    --line: #2c3037;
    --line-2: #3a3f47;
    --text: #e9edf2;
    --dim: #9aa3ad;
    --faint: #6d757e;
    --accent: #e8443a;
    --green: #35d07f;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 20px 20px 48px; }

  /* ------------------------------------------------------------- header */
  header {
    display: flex; align-items: center; gap: 12px;
    padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 18px;
  }
  .mark { display: flex; flex-direction: column; gap: 3px; }
  .mark i { display: block; height: 3px; border-radius: 1px; background: var(--faint); }
  .mark i:first-child { background: var(--accent); width: 24px; }
  .mark i:nth-child(2) { width: 17px; }
  .mark i:nth-child(3) { width: 20px; }
  h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  header .sub { font-size: 12px; color: var(--faint); }
  header .right { margin-left: auto; display: flex; gap: 8px; }

  button {
    font: inherit; font-size: 13px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line-2); border-radius: 6px;
    padding: 7px 13px; cursor: pointer;
  }
  button:hover { border-color: var(--faint); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost { background: none; }

  /* --------------------------------------------------------------- lock */
  .lock {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; margin-bottom: 20px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
  }
  .lock.on { border-color: var(--accent); background: rgba(232, 68, 58, 0.07); }
  .lock .txt { flex: 1 1 auto; min-width: 0; }
  .lock .txt b { display: block; font-size: 14px; }
  .lock .txt span { font-size: 12.5px; color: var(--dim); }

  /* -------------------------------------------------------------- cards */
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; margin-bottom: 12px; overflow: hidden;
  }
  .card .top {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px; cursor: pointer;
  }
  .card .top:hover { background: rgba(255,255,255,0.02); }
  .card .name { font-weight: 600; }
  .card .blurb { font-size: 12.5px; color: var(--faint); }
  .card .grow { flex: 1 1 auto; min-width: 0; }
  .card .chev { color: var(--faint); font-size: 12px; transition: transform .15s; }
  .card.open .chev { transform: rotate(90deg); }
  .card .body { display: none; padding: 4px 16px 16px; border-top: 1px solid var(--line); }
  .card.open .body { display: block; }
  .card.off .name, .card.off .blurb { opacity: 0.45; }

  /* switch */
  .sw { position: relative; width: 38px; height: 22px; flex: none; }
  .sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .sw span {
    position: absolute; inset: 0; border-radius: 11px;
    background: var(--line-2); transition: background .15s; pointer-events: none;
  }
  .sw span::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; transition: transform .15s;
  }
  .sw input:checked + span { background: var(--green); }
  .sw input:checked + span::after { transform: translateX(16px); }

  /* fields */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px 16px; margin-top: 14px; }
  .f { display: flex; flex-direction: column; gap: 5px; }
  .f label { font-size: 12px; color: var(--dim); }
  .f input[type=number], .f select {
    font: inherit; font-size: 13px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line-2); border-radius: 6px; padding: 6px 9px;
    width: 100%;
  }
  .f.bool { flex-direction: row; align-items: center; gap: 9px; }
  .f.bool label { font-size: 13px; color: var(--text); }
  .f input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }

  .row { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .row .sp { flex: 1 1 auto; }

  footer { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line);
           display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  footer .note { font-size: 12px; color: var(--faint); flex: 1 1 260px; }

  .empty { color: var(--faint); padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mark"><i></i><i></i><i></i></div>
    <div>
      <h1>PitWall HUD</h1>
      <div class="sub" id="sub">Loading…</div>
    </div>
    <div class="right">
      <button class="ghost" id="reload">Reload widgets</button>
    </div>
  </header>

  <div class="lock" id="lock">
    <div class="txt">
      <b id="lockTitle">Widgets are locked</b>
      <span id="lockHint">Locked widgets are click-through and cannot swallow a click meant for the car.</span>
    </div>
    <button class="primary" id="lockBtn">Unlock to move</button>
  </div>

  <div id="cards"><div class="empty">Loading widgets…</div></div>

  <footer>
    <div class="note">
      Settings follow you between setups. Positions are saved per screen
      arrangement, so changing monitors does not scatter your layout.
    </div>
    <button id="reset">Reset layout for this screen setup</button>
    <button id="quit">Quit PitWall HUD</button>
  </footer>

</div>

<script>
(function () {
  'use strict';

  var open = {};          // which cards are expanded, kept across redraws
  var cardsEl = document.getElementById('cards');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  }

  function fieldHtml(name, spec, value) {
    var id = 'f-' + name + '-' + spec.key;
    if (spec.type === 'bool') {
      return '<div class="f bool">' +
        '<input type="checkbox" id="' + id + '" data-w="' + esc(name) + '" data-k="' + esc(spec.key) + '"' +
        (value ? ' checked' : '') + '>' +
        '<label for="' + id + '">' + esc(spec.label) + '</label></div>';
    }
    if (spec.type === 'choice') {
      var opts = (spec.options || []).map(function (o) {
        var lab = o === '' ? '(none)' : o;
        return '<option value="' + esc(o) + '"' + (String(value) === String(o) ? ' selected' : '') +
               '>' + esc(lab) + '</option>';
      }).join('');
      return '<div class="f"><label for="' + id + '">' + esc(spec.label) + '</label>' +
        '<select id="' + id + '" data-w="' + esc(name) + '" data-k="' + esc(spec.key) + '">' +
        opts + '</select></div>';
    }
    return '<div class="f"><label for="' + id + '">' + esc(spec.label) + '</label>' +
      '<input type="number" id="' + id + '" data-w="' + esc(name) + '" data-k="' + esc(spec.key) + '"' +
      (spec.min != null ? ' min="' + spec.min + '"' : '') +
      (spec.max != null ? ' max="' + spec.max + '"' : '') +
      ' step="' + (spec.step || 1) + '" value="' + esc(value) + '"></div>';
  }

  function render(s) {
    document.getElementById('sub').textContent =
      s.widgets.filter(function (w) { return w.on; }).length + ' of ' +
      s.widgets.length + ' widgets on  ·  ' + s.displays.length +
      (s.displays.length === 1 ? ' screen' : ' screens');

    var lock = document.getElementById('lock');
    lock.classList.toggle('on', s.editMode);
    document.getElementById('lockTitle').textContent =
      s.editMode ? 'Widgets are unlocked' : 'Widgets are locked';
    document.getElementById('lockHint').textContent = s.editMode
      ? 'Drag them by the red bar at the top of each one, then lock again. They will take mouse clicks until you do.'
      : 'Locked widgets are click-through and cannot swallow a click meant for the car.';
    document.getElementById('lockBtn').textContent =
      s.editMode ? 'Lock them again' : 'Unlock to move';

    var html = s.widgets.map(function (w) {
      var isOpen = !!open[w.name];
      var fields = w.settings.map(function (spec) {
        return fieldHtml(w.name, spec, w.values[spec.key] !== undefined ? w.values[spec.key] : spec.def);
      }).join('');

      var screens = s.displays.length > 1
        ? '<div class="row"><div class="f" style="max-width:280px">' +
            '<label>Screen</label><select data-screen="' + esc(w.name) + '">' +
            s.displays.map(function (d) {
              return '<option value="' + d.id + '"' + (d.id === w.display ? ' selected' : '') +
                     '>' + esc(d.label) + '</option>';
            }).join('') +
            '</select></div></div>'
        : '';

      return '<div class="card' + (isOpen ? ' open' : '') + (w.on ? '' : ' off') +
             '" data-card="' + esc(w.name) + '">' +
        '<div class="top" data-toggle="' + esc(w.name) + '">' +
          '<label class="sw" onclick="event.stopPropagation()">' +
            '<input type="checkbox" data-on="' + esc(w.name) + '"' + (w.on ? ' checked' : '') + '>' +
            '<span></span></label>' +
          '<div class="grow"><div class="name">' + esc(w.label) + '</div>' +
          '<div class="blurb">' + esc(w.blurb) + '</div></div>' +
          '<div class="chev">&#9656;</div>' +
        '</div>' +
        '<div class="body"><div class="grid">' + fields + '</div>' + screens + '</div>' +
      '</div>';
    }).join('');

    cardsEl.innerHTML = html || '<div class="empty">No widgets.</div>';
  }

  function refresh() { window.hud.state().then(render); }

  /* --------------------------------------------------------------- events */

  cardsEl.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-toggle]');
    if (t) {
      var n = t.dataset.toggle;
      open[n] = !open[n];
      var card = cardsEl.querySelector('[data-card="' + n + '"]');
      if (card) card.classList.toggle('open', open[n]);
    }
  });

  cardsEl.addEventListener('change', function (ev) {
    var el = ev.target;

    if (el.dataset.on !== undefined) {
      window.hud.setEnabled(el.dataset.on, el.checked).then(render);
      return;
    }
    if (el.dataset.screen !== undefined) {
      window.hud.setDisplay(el.dataset.screen, Number(el.value)).then(render);
      return;
    }
    if (el.dataset.w !== undefined) {
      var v;
      if (el.type === 'checkbox') v = el.checked;
      else if (el.type === 'number') v = el.value === '' ? 0 : Number(el.value);
      else v = el.value;
      var payload = {};
      payload[el.dataset.k] = v;
      // Do not redraw on every keystroke: rebuilding the cards would steal
      // focus from the field being typed into.
      window.hud.setSettings(el.dataset.w, payload);
    }
  });

  document.getElementById('lockBtn').addEventListener('click', function () {
    window.hud.state().then(function (s) {
      return window.hud.setEdit(!s.editMode);
    }).then(render);
  });
  document.getElementById('reload').addEventListener('click', function () {
    window.hud.reload().then(render);
  });
  document.getElementById('reset').addEventListener('click', function () {
    window.hud.reset().then(render);
  });
  document.getElementById('quit').addEventListener('click', function () {
    window.hud.quit();
  });

  window.hud.onState(render);
  refresh();
}());
</script>
</body>
</html>
